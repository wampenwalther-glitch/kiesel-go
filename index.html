<style>

:root {

.stats .k { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .stats .v { font: 600 18px var(--f-body); font-variant-numeric: tabular-nums; }
.wr { display: grid; gap: 4px; } .wrlab { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); } .wrlab b { color: var(--ink); font-variant-numeric: tabular-nums; }
.result { border-radius: 10px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 8px; }
.result.win { border-color: var(--ok); } .result.loss { border-color: var(--no); } .result h3, .result p { margin: 0; }
.mist { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.mistake { text-align: left; background: none; border: 0; color: var(--ink); font: 14px var(--f-body); cursor: pointer; padding: 2px 0; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
body.busy #board { cursor: progress; }
.hud { display: grid; grid-template-columns: auto 80px auto; grid-template-areas: "n b x" "d d d"; align-items: center; gap: 1px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; cursor: pointer; color: var(--ink); font: 12.5px var(--f-body); text-align: left; min-width: 0; }
.hud:hover { border-color: var(--accent); }
.hname { grid-area: n; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .hxp { grid-area: x; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; } .hday { grid-area: d; color: var(--muted); font-size: 11.5px; }
.hbar { grid-area: b; height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; } .hbar span { display: block; height: 100%; background: var(--gold); }
#celebrate { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 30; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cel-card { background: var(--surface); border: 2px solid var(--gold); border-radius: 16px; padding: 18px 26px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: grid; gap: 4px; max-width: 360px; }

.cel-title { font: 600 22px/1.25 var(--f-display); text-wrap: balance; } .cel-card.big .cel-title { font-size: 26px; }
.cel-stars span { font-size: 30px; color: var(--line); margin: 0 2px; } .cel-stars span.on { color: var(--gold); }
.cel-xp { font: 700 20px var(--f-body); color: var(--gold); font-variant-numeric: tabular-nums; } .cel-sub { color: var(--muted); font-size: 14px; }

@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.seal { --s: 64px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: inline-grid; place-items: center; font: 700 calc(var(--s) * .5)/1 "KaiTi", "STKaiti", "Kaiti SC", "SimSun", "Songti SC", "Noto Serif CJK SC", serif; color: #fff8e6; text-shadow: 0 1px 2px rgba(0,0,0,.45); box-shadow: inset 0 0 0 calc(var(--s) * .06) rgba(255,255,255,.35), inset 0 calc(var(--s) * -.08) calc(var(--s) * .16) rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25); background: radial-gradient(circle at 35% 30%, var(--m1), var(--m2) 70%); }
.m-stone { --m1: #9a9a92; --m2: #4f4f49; } .m-jade { --m1: #8fd3ae; --m2: #2f7a57; } .m-bronze { --m1: #e0a56a; --m2: #7a4a22; } .m-iron { --m1: #9aa3ad; --m2: #3c434b; }
.m-silver { --m1: #f4f6f8; --m2: #8c96a0; color: #2a2f35; text-shadow: none; } .m-red { --m1: #f08a6a; --m2: #9b2418; } .m-gold { --m1: #ffe7a0; --m2: #b07a1e; color: #5a2d00; text-shadow: 0 1px 0 rgba(255,255,255,.4); }

.seals { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 8px; }
.sealitem { display: grid; justify-items: center; text-align: center; gap: 3px; } .sealitem .sname { font-size: 12.5px; font-weight: 600; line-height: 1.2; } .sealitem .ssub { font-size: 11.5px; color: var(--muted); font-style: italic; }

.fx { position: fixed; inset: 0; pointer-events: none; z-index: 29; }

.name-card input { font: 17px var(--f-body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 860px) { .hud { order: 3; width: 100%; grid-template-columns: auto auto 1fr auto; } }

}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

</div></header>

const GoEngine = (function () {

  const src = [

  rows: [".......", ".......", ".......", ".......", ".......", "XX.O...", "WW....."],
  hint: "In der Ecke hat eine Kette besonders wenige Freiheiten.", explain: "Zwei Steine in der Ecke haben hier nur eine Freiheit übrig. Ecken sind gefährliche Orte für Steine ohne Rückhalt." },
{ id: "F04", cat: "fangen", lvl: 2, kind: "capture", title: "Zum Rand treiben", sol: "D2",
  rows: [".......", ".......", ".......", ".......", "..X....", ".XW....", "......."],
  hint: "Gib Atari von der Seite, auf der Weiß ins Freie laufen könnte.", explain: "Atari von der offenen Seite treibt den Stein an den Rand. Dort gehen ihm die Freiheiten aus. Atari von unten hätte ihn ins Freie entkommen lassen." },
{ id: "F05", cat: "fangen", lvl: 2, kind: "capture", title: "Doppel-Atari", sol: "D4",
  rows: [".......", ".......", "..X....", "..W....", "..XW...", "...X...", "......."],
  hint: "Suche den Punkt, der an beide weißen Steine grenzt.", explain: "Ein Zug, zwei Ataris: Weiß kann nur einen Stein retten, den anderen fängst du. Das Doppel-Atari ist eine der wichtigsten Taktiken." },
{ id: "F06", cat: "fangen", lvl: 2, kind: "capture", title: "Den Rückweg abschneiden", sol: "D3",
  rows: [".......", ".......", ".......", "...O...", ".......", "..XWX..", "......."],
  hint: "Auf welcher Seite wartet ein weißer Freund?", explain: "Atari von oben trennt den Stein von seinem Helfer und drückt ihn an den Rand. Atari von unten hätte ihm die Verbindung geschenkt." },
{ id: "F07", cat: "fangen", lvl: 2, kind: "capture", title: "Wettlauf um Freiheiten", sol: "D1 E1",
  rows: [".......", ".......", ".......", ".OO.X..", ".OOXX..", "OXXWWX.", "......."],
  hint: "Beide Ketten haben zwei Freiheiten. Wer zuerst Atari gibt, gewinnt.", explain: "Im Wettlauf zählt jede Freiheit. Du bist am Zug und beide Seiten haben gleich viele – also gewinnst du, wenn du sofort eine Freiheit nimmst." },
{ id: "F08", cat: "fangen", lvl: 2, kind: "capture", title: "In die Sackgasse", sol: "D3 E4 E5 F4",
  rows: [".......", ".......", "...X...", "..XW...", "..X.X..", ".......", "......."],
  hint: "Einer der beiden Fluchtwege endet zwischen deinen Steinen.", explain: "Du lässt Weiß nur den Weg, der zwischen deinen Steinen endet. Nach der Flucht dorthin hat die Kette wieder nur eine Freiheit." },
{ id: "F09", cat: "fangen", lvl: 3, kind: "capture", title: "Am Rand entlang", sol: "A1 A3 A4 B3",
  rows: [".......", ".......", ".......", ".......", ".......", "WX.....", "......."],
  hint: "Treibe den Stein in die Ecke, nicht aus ihr heraus.", explain: "Auf der ersten Linie gewinnt ein fliehender Stein kaum Freiheiten. Atari von der offenen Seite treibt ihn in die Ecke." },
{ id: "F10", cat: "fangen", lvl: 3, kind: "capture", title: "Der Köder", sol: "D1", depth: 10,
  rows: [".......", ".......", ".......", ".....O.", "..XXXO.", ".XWWXO.", ".X..OO."],
  hint: "Opfere einen Stein dort, wo Weiß sich sonst verbinden würde.", explain: "Das ist ein Mausefallen-Fang (Snapback): Weiß schlägt deinen Opferstein, hat danach aber selbst nur eine Freiheit – und du schlägst drei Steine zurück. Atari von außen hätte Weiß die Verbindung erlaubt." },
{ id: "F11", cat: "fangen", lvl: 1, kind: "capture", title: "Drei auf einmal", sol: "E2 E3 F1 F3 G2 G3",
  rows: [".......", ".......", "..XXX..", ".XWWWX.", "..XX...", ".....O.", "......."],
  hint: "Zähle die Freiheiten der ganzen weißen Kette.", explain: "Die drei weißen Steine sind eine Kette und teilen sich eine einzige Freiheit. Auch große Ketten sterben, wenn ihre letzte Freiheit fällt." },
// ---------------- Steine retten ----------------
{ id: "R01", cat: "retten", lvl: 1, kind: "save", title: "Verlängern", sol: "D3",
  rows: [".......", ".......", "...O...", "..OBO..", ".......", ".......", "......."],
  hint: "Setze einen Stein auf die letzte Freiheit – die Kette bekommt neue.", explain: "Durch das Verlängern wird aus einem Stein mit einer Freiheit eine Kette mit drei Freiheiten." },
{ id: "R02", cat: "retten", lvl: 1, kind: "save", title: "Hand in Hand", sol: "D3",
  rows: [".......", ".......", ".......", "..O....", ".OB.X..", "..O....", "......."],
  hint: "Rechts steht ein Freund.", explain: "Verbundene Steine teilen ihre Freiheiten. Durch die Verbindung ist dein Stein in Sicherheit." },
{ id: "R03", cat: "retten", lvl: 2, kind: "save", title: "Angriff ist die beste Verteidigung", sol: "C2",
  rows: [".......", ".......", ".......", "..XO...", ".XOBO..", "....O..", "...O..."],
  hint: "Auch ein weißer Stein hat nur noch eine Freiheit.", explain: "Weglaufen hätte nicht geholfen: Die Kette hätte wieder nur eine Freiheit gehabt. Wer den Angreifer schlägt, gewinnt dessen Punkt als neue Freiheit." },
{ id: "R04", cat: "retten", lvl: 2, kind: "save", title: "Die richtige Richtung", sol: "E3",
  rows: [".........", ".........", ".........", ".........", ".........", "..OO.....", ".OBB.X...", "..O.O....", "........."],
  hint: "Laufe zu deinem Freund, nicht in die Enge.", explain: "Nach rechts verbindest du dich mit deinem Stein und hast reichlich Freiheiten. Nach unten wärst du am Rand in der Falle gelandet." },
{ id: "R05", cat: "retten", lvl: 2, kind: "save", title: "Zwei Sorgen, ein Zug", sol: "D3",
  rows: [".........", ".........", ".........", ".........", "...O.....", "..OBO....", ".OB......", "..OXXX...", "........."],
  hint: "Beide Steine stehen im Atari. Gibt es einen gemeinsamen Punkt?", explain: "Der Verbindungspunkt rettet beide Steine gleichzeitig und schließt sie an die starke Kette darunter an." },
{ id: "R06", cat: "retten", lvl: 2, kind: "save", title: "Erst schlagen", sol: "D1",
  rows: [".........", ".........", ".........", ".........", ".........", "..OX.....", ".OBOX....", ".OBOX....", ".O......."],
  hint: "Deine zwei Steine haben eine Freiheit – die weißen daneben auch.", explain: "Verlängern nach C1 hätte nichts gebracht: weiter nur eine Freiheit. Das Schlagen der beiden weißen Steine löst das Problem endgültig." },
{ id: "R07", cat: "retten", lvl: 2, kind: "save", title: "Rettung am Rand", sol: "B1",
  rows: [".......", ".......", ".......", ".......", ".......", ".XXO...", "..OB.O."],
  hint: "Am Rand führt Verlängern selten weit. Was steht links im Atari?", explain: "Verlängern auf der ersten Linie bringt nur eine einzige neue Freiheit. Das Schlagen des weißen Steins verschafft Luft und verbindet." },
{ id: "R08", cat: "retten", lvl: 2, kind: "save", title: "Nicht ablenken lassen", sol: "D3",
  rows: [".......", ".....X.", "....XOX", "..O....", ".OB.X..", "..O....", "......."],
  hint: "Der weiße Stein oben läuft nicht weg. Dein eigener Stein braucht dich zuerst.", explain: "Der weiße Stein oben rechts lässt sich auch später noch fangen. Hättest du ihn zuerst geschlagen, wäre dein eigener Stein verloren gegangen. Eigene Sicherheit zuerst!" },
// ---------------- Leitern und Netze ----------------
{ id: "L01", cat: "leiter", lvl: 2, kind: "capture", title: "Die Leiter", sol: "D3", depth: 26,
  rows: [".......", ".......", ".......", ".X.....", ".XW....", "..X....", "......."],
  hint: "Gib so Atari, dass Weiß nach jeder Flucht wieder nur zwei Freiheiten hat.", explain: "In der Leiter gibst du abwechselnd von links und rechts Atari. Weiß läuft im Zickzack – bis zum Rand, wo die Flucht endet. Wer in eine funktionierende Leiter läuft, verliert immer mehr Steine." },
{ id: "L02", cat: "leiter", lvl: 3, kind: "capture", title: "Welche Leiter funktioniert?", sol: "D5 E5", depth: 30,
  rows: [".........", "....O....", ".........", ".........", "..X......", "..XW.....", "...XX....", ".........", "........."],
  hint: "Verfolge beide Zickzack-Wege im Kopf. Auf einem steht ein weißer Stein im Weg.", explain: "Ein Stein des Gegners auf dem Leiterweg ist ein Leiterbrecher. Die eine Leiter läuft an ihm vorbei, die andere prallt an ihm ab. Lies eine Leiter immer bis zum Ende, bevor du sie beginnst." },
{ id: "L03", cat: "leiter", lvl: 2, kind: "save", title: "Der Leiterbrecher", sol: "C4", depth: 26,
  rows: [".........", ".........", ".........", ".....X...", ".........", ".O.......", ".OBO.....", "..O......", "........."],
  hint: "Dein Stein auf F6 steht genau auf dem Fluchtweg.", explain: "Normalerweise ist Weglaufen in einer Leiter ein Fehler. Hier steht dein eigener Stein auf dem Weg: Sobald die fliehende Kette ihn erreicht, hat sie genug Freiheiten." },
{ id: "L04", cat: "leiter", lvl: 3, kind: "capture", title: "Das Netz", sol: "E5",
  rows: [".........", ".........", "......O..", ".........", "..X......", "..XW.....", "...XX....", ".........", "........."],
  hint: "Die Leiter scheitert am weißen Stein oben. Fange locker – ohne Atari.", explain: "Das Netz (Geta) versperrt beide Fluchtwege auf einmal, ohne den Stein zu berühren. Wohin Weiß auch drückt, du schließt die Tür. Netze funktionieren auch dann, wenn Leitern gebrochen sind." },
{ id: "L05", cat: "leiter", lvl: 3, kind: "capture", title: "Netz für zwei", sol: "F5",
  rows: [".........", ".........", "......O..", ".........", "...X.....", "..XWW....", "...XXX...", ".........", "........."],
  hint: "Welcher Punkt bewacht beide Ausgänge der zwei Steine?", explain: "Auch zwei Steine lassen sich im Netz fangen. Der Schlüsselpunkt liegt diagonal vor der Kette, zwischen den beiden Ausgängen." },
{ id: "L06", cat: "leiter", lvl: 2, kind: "capture", title: "Kurze Leiter zum Rand", sol: "D3",
  rows: [".......", ".......", ".......", "..X....", ".XW....", ".X.....", "......."],
  hint: "Der Rand ist nah. Von welcher Seite treibst du den Stein dorthin?", explain: "Der Rand wirkt wie eine Mauer aus deinen Steinen. Zwei Ataris genügen, dann hat die weiße Kette keinen Platz mehr." },
// ---------------- Verbinden und Schneiden ----------------
{ id: "V01", cat: "schnitt", lvl: 1, kind: "connect", title: "Auf das Hineinschauen antworten", sol: "D4",
  rows: [".......", ".......", "...O...", "..B*B..", ".......", ".......", "......."],
  hint: "Weiß droht, zwischen deine Steine zu setzen.", explain: "Der weiße Stein „schaut hinein“ und droht zu schneiden. Die feste Verbindung ist die sichere Antwort." },
{ id: "V02", cat: "schnitt", lvl: 1, kind: "connect", title: "Diagonale in Gefahr", sol: "C3",
  rows: [".......", ".......", ".......", "..BO...", "..*B...", ".......", "......."],
  hint: "Zwei diagonale Steine haben zwei Verbindungspunkte. Einer ist schon besetzt.", explain: "Diagonal stehende Steine sind verbunden, solange beide Verbindungspunkte frei sind. Ist einer vom Gegner besetzt, musst du den anderen sofort nehmen." },
{ id: "V03", cat: "schnitt", lvl: 1, kind: "connect", title: "Der Bambus", sol: "D3",
  rows: [".......", ".......", ".......", "..BOX..", "..X*B..", ".......", "......."],
  hint: "Weiß hat einen der beiden Verbindungspunkte genommen.", explain: "Zwei parallele Zweierketten mit einer Lücke heißen Bambus. Nimmt der Gegner einen Verbindungspunkt, nimmst du den anderen." },
{ id: "V04", cat: "schnitt", lvl: 2, kind: "connect", title: "Doppel-Atari verhindern", sol: "D4",
  rows: [".......", ".......", ".......", ".OB*...", "..OBO..", ".......", "......."],
  hint: "Auf welchem Punkt würde Weiß beide Steine gleichzeitig bedrohen?", explain: "Der Punkt, auf dem der Gegner ein Doppel-Atari geben könnte, ist auch dein bester Verbindungspunkt." },
{ id: "V05", cat: "schnitt", lvl: 1, kind: "cut", title: "Der Keil", sol: "D4",
  rows: [".......", ".......", "...X...", "..W*W..", "...X...", ".......", "......."],
  hint: "Deine Steine oben und unten stützen den Schnitt.", explain: "Zwischen zwei Steine mit einer Lücke passt genau ein Keil. Mit Unterstützung von beiden Seiten ist der Schnitt sicher." },
{ id: "V06", cat: "schnitt", lvl: 1, kind: "cut", title: "Diagonale durchtrennen", sol: "D4",
  rows: [".......", ".......", ".......", "..W*...", "..XW...", ".......", "......."],
  hint: "Einen Verbindungspunkt hast du schon.", explain: "Besetzt du beide Verbindungspunkte einer Diagonale, sind die Steine getrennt." },
{ id: "V07", cat: "schnitt", lvl: 3, kind: "cut", title: "Den Rösselsprung schneiden", sol: "D3 D4",
  rows: [".......", ".......", "...X...", "..W**..", "..**W..", "...X...", "......."],
  hint: "Zwischen den weißen Steinen liegen zwei Punkte. Nach deinem Zug braucht Weiß zwei weitere Züge.", explain: "Der Rösselsprung ist eine lockere Verbindung. Stehen eigene Steine in der Nähe, lässt er sich schneiden: Du setzt in die Lücke und hast danach zwei Schnittpunkte zur Wahl." },
{ id: "V08", cat: "schnitt", lvl: 2, kind: "connect", title: "Drei Steine, ein Punkt", sol: "D2 D3",
  rows: [".......", ".......", ".......", "..OXO..", "..B*B..", ".......", "......."],
  hint: "Ein einziger Punkt berührt alle drei schwarzen Steine.", explain: "Der gemeinsame Verbindungspunkt mehrerer Steine ist der wichtigste Punkt der Form – für beide Seiten. D2 funktioniert hier übrigens auch: Danach wäre ein weißer Stein auf D3 Selbstmord." },
{ id: "V09", cat: "schnitt", lvl: 1, kind: "cut", title: "Schnitt am Rand", sol: "D1",
  rows: [".......", ".......", ".......", ".......", ".......", "...X...", "..W*W.."],
  hint: "Dein Stein über der Lücke hilft beim Schneiden.", explain: "Auch am Rand gilt: In die Lücke zwischen zwei Steinen passt ein Keil. Dein Stein darüber gibt ihm die nötigen Freiheiten." },
// ---------------- Leben und Tod ----------------
{ id: "T01", cat: "leben", lvl: 1, kind: "kill", title: "Drei in einer Reihe", sol: "D1",
  rows: [".......", ".......", ".......", ".......", "XXXXXXX", "XWOOOOX", "XO***OX"],
  hint: "Welcher Punkt würde den Innenraum in zwei Augen teilen?", explain: "Ein Innenraum aus drei Punkten in einer Reihe hat einen Schlüsselpunkt: die Mitte. Besetzt Weiß ihn, entstehen zwei Augen. Besetzt du ihn, bleibt nur ein Auge." },
{ id: "T02", cat: "leben", lvl: 1, kind: "live", title: "Zwei Augen bauen", sol: "D1",
  rows: [".......", ".......", ".......", ".......", "OOOOOOO", "OBXXXXO", "OX***XO"],
  hint: "Teile deinen Innenraum in zwei getrennte Punkte.", explain: "Zwei getrennte Augen machen eine Gruppe unschlagbar: Weiß kann nie beide gleichzeitig besetzen, und jeder einzelne Zug dort wäre Selbstmord." },
{ id: "T03", cat: "leben", lvl: 2, kind: "kill", title: "Der Winkel in der Ecke", sol: "A1",
  rows: [".......", ".......", ".......", "XXX....", "WOXX...", "*OOX...", "**OX..."],
  hint: "Der Schlüsselpunkt ist der Punkt, der beide anderen berührt.", explain: "Auch ein gewinkelter Dreier-Raum hat genau einen Schlüsselpunkt: den Knick. Hier liegt er auf dem Eckpunkt." },
{ id: "T04", cat: "leben", lvl: 3, kind: "kill", title: "Der dicke Fünfer", sol: "C1",
  rows: [".........", ".........", ".........", ".........", ".........", "XXXXX....", "WOOOXX...", "O**OOX...", "O***OX..."],
  hint: "Ein Punkt hat drei freie Nachbarn im Innenraum.", explain: "Der dicke Fünfer (ein Quadrat mit Anhängsel) hat einen Schlüsselpunkt. Spielst du dort, kann Weiß den Raum nicht mehr in zwei Augen teilen." },
{ id: "T05", cat: "leben", lvl: 2, kind: "kill", title: "Die Pyramide", sol: "C1",
  rows: [".........", ".........", ".........", ".........", ".........", "XXXXX....", "XWOOXX...", "OO*OOX...", "O***OX..."],
  hint: "Suche den Punkt mit den meisten Nachbarn im Innenraum.", explain: "Der Vierer-Raum in T-Form lebt oder stirbt mit seinem Mittelpunkt." },
{ id: "T06", cat: "leben", lvl: 2, kind: "live", title: "Die Pyramide retten", sol: "C1",
  rows: [".........", ".........", ".........", ".........", ".........", "OOOOO....", "OBXXOO...", "XX*XXO...", "X***XO..."],
  hint: "Derselbe Punkt, den der Gegner zum Töten bräuchte.", explain: "Der Schlüsselpunkt des Gegners ist auch dein Schlüsselpunkt. Mit dem Mittelpunkt entstehen drei getrennte Augenpunkte." },
{ id: "T07", cat: "leben", lvl: 2, kind: "live", title: "Leben in der Ecke", sol: "A1",
  rows: [".......", ".......", ".......", "OOO....", "BXOO...", "*XXO...", "**XO..."],
  hint: "Besetze den Knick deines Dreier-Raums.", explain: "Mit dem Eckpunkt trennst du die beiden anderen Punkte voneinander: zwei Augen." },
{ id: "T08", cat: "leben", lvl: 2, kind: "kill", title: "Das zweite Auge verhindern", sol: "E1",
  rows: [".......", ".......", ".......", ".......", "XXXXXX.", "WOOOOX.", "**O**X."],
  hint: "Links hat Weiß ein Auge. Rechts ist der Raum noch offen.", explain: "Ein Auge ist erst ein Auge, wenn es ringsum geschlossen ist. Du besetzt den Punkt, mit dem Weiß sein zweites Auge geschlossen hätte." },
{ id: "T09", cat: "leben", lvl: 2, kind: "live", title: "Das Auge schließen", sol: "E1",
  rows: [".......", ".......", ".......", ".......", "OOOOOO.", "BXXXXO.", "**X**O."],
  hint: "Rechts fehlt deinem Auge noch eine Wand.", explain: "Mit diesem Zug ist das rechte Auge geschlossen. Zusammen mit dem Auge links lebt die Gruppe." },
{ id: "T10", cat: "leben", lvl: 3, kind: "kill", title: "Das Kreuz", sol: "C2",
  rows: [".........", ".........", ".........", ".........", "XXXXX....", "XOOOXX...", "OO*OOX...", "O***OX...", "OW*OOX..."],
  hint: "Die Mitte berührt alle vier anderen Punkte.", explain: "Im kreuzförmigen Fünfer-Raum entscheidet der Mittelpunkt. Mit ihm bleiben Weiß nur einzelne Punkte, die er nicht alle zu Augen machen kann, ohne deinen Stein zu schlagen – und dann bleibt nur ein Auge." },
{ id: "T11", cat: "leben", lvl: 3, kind: "live", title: "Das Kreuz verteidigen", sol: "C2", depth: 34,
  rows: [".........", ".........", ".........", ".........", "OOOOO....", "OXXXOO...", "XX*XXO...", "X***XO...", "XB*XXO..."],
  hint: "Ein Zug erzeugt vier getrennte Augenpunkte.", explain: "Mit dem Mittelpunkt hast du auf einen Schlag vier einzelne Augen. Mehr als genug zum Leben." },
{ id: "T12", cat: "leben", lvl: 1, kind: "kill", title: "Drei am linken Rand", sol: "A4",
  rows: ["XXX....", "OWX....", "*OX....", "*OX....", "*OX....", "OOX....", "XXX...."],
  hint: "Die Form kennst du schon – nur gedreht.", explain: "Formen wiederzuerkennen, egal wie sie gedreht sind, ist der Kern von Leben und Tod. Die Mitte des Dreier-Raums entscheidet." },
{ id: "T13", cat: "leben", lvl: 1, kind: "kill", title: "Drei am oberen Rand", sol: "D7",
  rows: ["XO***OX", "XWOOOOX", "XXXXXXX", ".......", ".......", ".......", "......."],
  hint: "Die Form kennst du aus der ersten Leben-und-Tod-Aufgabe.", explain: "Gedreht oder gespiegelt bleibt die Form gleich: Die Mitte des Dreier-Raums entscheidet über Leben und Tod." },
{ id: "T14", cat: "leben", lvl: 1, kind: "live", title: "Zwei Augen oben", sol: "D7",
  rows: ["OX***XO", "OBXXXXO", "OOOOOOO", ".......", ".......", ".......", "......."],
  hint: "Teile den Raum in zwei Teile.", explain: "Mit dem Mittelpunkt entstehen zwei getrennte Augen. Damit ist die Gruppe für immer sicher." },
{ id: "T15", cat: "leben", lvl: 2, kind: "kill", title: "Winkel rechts unten", sol: "G1",
  rows: [".......", ".......", ".......", "....XXX", "...XXOW", "...XOO*", "...XO**"],
  hint: "Welcher Punkt berührt die beiden anderen freien Punkte?", explain: "Wie in der Aufgabe links unten liegt der Schlüsselpunkt des gewinkelten Dreier-Raums auf dem Eckpunkt." },
// ---------------- Endspiel ----------------
{ id: "E01", cat: "endspiel", lvl: 1, kind: "score", title: "Der neutrale Punkt", sol: "C3",
  rows: [".XO..", ".XO..", ".X*O.", ".XO..", ".XO.."],
  hint: "Bei der Gebietszählung zählt jeder eigene Stein auf dem Brett.", explain: "Nach chinesischen Regeln zählen Steine und Gebiet. Deshalb ist auch ein neutraler Punkt zwischen den Mauern einen Punkt wert – wer ihn besetzt, bekommt ihn." },
{ id: "E02", cat: "endspiel", lvl: 2, kind: "score", title: "Retten ist größer", sol: "C2",
  rows: ["..XO...", "..XO...", "..X*O..", "..XXO..", "..XO...", ".**XO..", "..XO..."],
  hint: "Einer deiner Steine steht im Atari. Vergleiche: Was verlierst du dort, was gewinnst du beim neutralen Punkt?", explain: "Würde Weiß deinen Stein schlagen, verlörest du zwei Punkte und Weiß gewänne zwei. Der neutrale Punkt oben ist nur einen Punkt wert. Im Endspiel gilt: der größte Zug zuerst." },
{ id: "E03", cat: "endspiel", lvl: 2, kind: "score", title: "Hane auf der ersten Linie", sol: "D1",
  rows: ["..XO...", "..XO...", "..XO...", "..XO...", "..XO...", "..XO...", ".****.."],
  hint: "Am unteren Rand ist die Grenze noch offen. Wie weit kommst du?", explain: "Mit dem Hane (dem Umbiegen um den gegnerischen Stein) schiebst du die Grenze um einen Punkt in Weiß' Bereich. Danach musst du deinen Hane-Stein verbinden." },
{ id: "E04", cat: "endspiel", lvl: 2, kind: "score", title: "Hane oder neutraler Punkt?", sol: "C1 D1",
  rows: ["..XO...", "..X*O..", "..XOO..", "..XO...", "..XO...", "..XO...", ".****.."],

    // Schlagen durch scheinbaren Selbstmord

    g = G(7, [".......", ".XXXXX.", ".XOOOX.", ".XO.OX.", ".XOOOX.", ".XXXXX.", "......."], BLACK);
    ok(g.play(P(g, "D4"), BLACK) && g.b.cap[1] === 8 && g.b.countLibs(g.b.cid[P(g, "D4")]) === 4, "Zug ins letzte Auge schlaegt die ganze Gruppe");
    g = G(7, [".......", ".XXXXX.", ".XOOOX.", ".XO.OX.", ".XOOOX.", ".XXXXX.", "......."], WHITE);
    ok(g.why(P(g, "D4"), WHITE) === "suicide", "Eigenes letztes Auge fuellen ist Selbstmord");
    // besetzter Punkt
    ok(g.why(P(g, "B2"), WHITE) === "occupied", "Besetzter Punkt ist kein legaler Zug");
    // einfaches Ko
    g = G(5, [".....", ".XO..", "XO.O.", ".XO..", "....."], BLACK);
    g.play(P(g, "C3"), BLACK);
    ok(g.why(P(g, "B3"), WHITE) === "superko", "Ko: sofortiges Zurueckschlagen ist verboten");
    ok(g.b.ko === P(g, "B3"), "Ko-Punkt wird vom Brett erkannt");
    g.play(P(g, "E5"), WHITE); g.play(P(g, "E1"), BLACK);
    ok(g.legal(P(g, "B3"), WHITE), "Ko: nach einem Zwischenzug-Paar darf zurueckgeschlagen werden");
    g.play(P(g, "B3"), WHITE);
    ok(g.why(P(g, "C3"), BLACK) === "superko" && at(g, "C3") === 0, "Ko: auch Schwarz darf nicht sofort zurueckschlagen");
    // kein Ko: zwei Steine geschlagen
    g = G(6, ["......", ".XXOO.", "XOO.XO", ".XXOO.", "......", "......"], BLACK);
    ok(g.play(P(g, "D4"), BLACK) && g.b.cap[1] === 2 && g.b.ko === 0, "Zwei Steine schlagen erzeugt kein Ko");
    ok(g.legal(P(g, "C4"), WHITE), "Zurueckschlagen (Snapback) nach Schlagen von zwei Steinen ist legal");
    // Superko: zwei hinschicken, einen zurueckholen
    g = G(5, [".....", ".....", "OO...", "OOX..", ".X.X."], BLACK);
    ok(g.play(P(g, "A1"), BLACK), "Superko-Aufbau: Schwarz spielt A1 (zwei Steine im Atari)");
    ok(g.play(P(g, "C1"), WHITE) && g.b.cap[2] === 2, "Superko-Aufbau: Weiss schlaegt zwei Steine");
    ok(g.b.ko === 0, "Superko-Fall ist kein einfaches Ko");
    ok(g.b.legal(P(g, "B1"), BLACK) && g.why(P(g, "B1"), BLACK) === "superko", "Positional Superko: Zurueckschlagen wuerde die Ausgangsstellung wiederholen");
    // Superko ueber Passen hinweg
    g = G(5, [".....", ".XO..", "XO.O.", ".XO..", "....."], BLACK);
    g.play(P(g, "C3"), BLACK); g.play(0, WHITE); g.play(0, BLACK);
    ok(g.b.ko === 0 && g.why(P(g, "B3"), WHITE) === "superko", "Positional Superko gilt auch nach zwei Passzuegen");
    // Passen
    g = new I.Game(9, 7.5);
    ok(g.play(0, BLACK) && !g.over() && g.play(0, WHITE) && g.over(), "Passen ist erlaubt; zwei Paesse beenden das Spiel");
    // Undo
    g = new I.Game(9, 7.5); g.play(P(g, "E5"), BLACK); g.play(P(g, "D5"), WHITE); const k1 = g.b.key(); g.play(P(g, "C3"), BLACK); g.undo(1);
    ok(g.b.key() === k1 && g.hist.length === 2 && g.legal(P(g, "C3"), BLACK), "Zuruecknehmen stellt Stellung und Verlauf wieder her");
    // Koordinaten
    g = new I.Game(19, 7.5);
    ok(g.b.toGTP(g.b.fromGTP("T19")) === "T19" && g.b.toGTP(g.b.fromGTP("j1")) === "J1" && g.b.fromGTP("I5") === -1 && g.b.fromGTP("pass") === 0, "GTP-Koordinaten (ohne I, Reihen von unten)");
    ok(g.b.fromGTP("A1") === g.b.pt(0, 0) && g.b.fromGTP("H8") === g.b.pt(7, 7) && g.b.fromGTP("J9") === g.b.pt(8, 8), "GTP-Koordinaten: Spalte J folgt direkt auf H");

    section("Auswertung bekannter Endstellungen");
    g = G(5, [".X.O.", "XXXOO", "XXXOO", "XXXOO", "XXXOO"], BLACK);
    ok(I.areaScore(g.b) === 4, "Seki: Flaechenwertung 14:10 (gemeinsame Freiheit neutral)", "ist " + I.areaScore(g.b));
    I.seed(11); let dead = I.deadStones(g, 300);
    ok(dead.every(function (v) { return v === 0; }), "Seki: keine Steine werden als tot markiert");
    ok(g.b.selfAtari(P(g, "C5"), BLACK) > 0 && g.b.selfAtari(P(g, "C5"), WHITE) > 0, "Seki: Zug auf die gemeinsame Freiheit ist Selbst-Atari");
    g = G(9, ["...XO....", "...XO....", "...XO....", "...XO....", "...XO....", "...XO....", "...XO....", "...XO....", "...XO...."], BLACK);
    ok(I.areaScore(g.b) === -9, "Geteiltes Brett 36:45");
    g = G(9, ["...XO....", "...XO..X.", "...XO....", "...XO....", "...XO....", "...XO....", "...XO....", ".O.XO....", "...XO...."], BLACK);
    I.seed(5); dead = I.deadStones(g, 400);
    let dl = []; for (let p = 0; p < g.b.S; p++) if (dead[p]) dl.push(g.b.toGTP(p));
    ok(dl.sort().join(",") === "B2,H8", "Tote Steine in fremdem Gebiet werden erkannt", "markiert: " + dl.join(","));
    ok(I.areaScore(g.b, dead) === -9, "Endstand nach Entfernen toter Steine 36:45", "ist " + I.areaScore(g.b, dead));
    g = G(9, [".X.XXO.O.", "XXXXXOOOO", "XXXXXO...", "OOOOXOOOO", ".O.OXOOXX", "OOOOXOOX.", "XXXXXOOXX", "XXXXXOOOO", ".X.XXO.O."], BLACK);
    // Weiss links (A4-C6, zwei Augen A5,C5) lebt in schwarzem Gebiet; Schwarz rechts (G4-J6, ein Auge) ist tot
    I.seed(7); dead = I.deadStones(g, 400);
    dl = []; for (let p = 0; p < g.b.S; p++) if (dead[p]) dl.push(g.b.toGTP(p));
    ok(dl.sort().join(",") === ["H5", "J5", "H4", "H3", "J3"].sort().join(","), "Gruppe mit zwei Augen lebt, Gruppe mit einem Auge ist tot", "markiert: " + dl.join(","));
    const terr = new Uint8Array(g.b.S); const sc = I.areaScore(g.b, dead, terr);
    // Schwarz: Steine links 4+4+3+1+1+1+4 = 18 + A9,C9,C7,A2..D1 (2+1+8=11)... per Referenz gezaehlt:
    const ref2 = new Ref(9); for (let i = 0; i < 81; i++) { const p = i2p(g.b, i); ref2.a[i] = dead[p] ? 0 : g.b.color[p]; }
    ok(sc === ref2.score(), "Flaechenwertung stimmt mit unabhaengiger Referenz ueberein", sc + " vs " + ref2.score());
    ok(terr[P(g, "A5")] === 2 && terr[P(g, "C5")] === 2 && terr[P(g, "H4")] === 2 && terr[P(g, "J4")] === 2 && terr[P(g, "A9")] === 1, "Gebietsmarkierung: Augen und geschlagene Gruppe korrekt zugeordnet");
    // Komi
    g = G(5, ["..X..", "..X..", "XXXXX", "OOOOO", "....."], BLACK);
    ok(I.areaScore(g.b) === 15 - 10 && (I.areaScore(g.b) - 7.5) < 0, "Komi 7,5: 15:10 auf dem Brett bedeutet Sieg fuer Weiss");

    section("Leiter- und Atari-Erkennung");
    let L = new Int16Array(4);
    g = G(9, [".........", ".........", ".........", ".........", ".........", ".........", "..X......", ".XOO.....", "..XX....."], BLACK);
    g.b.getLibs(g.b.cid[P(g, "C2")], L, 3);
    ok(g.b.toGTP(I.ladderAttack(g.b, P(g, "C2"), L[0], L[1], 0)) === "E2", "Leiter funktioniert: richtiger Atari-Zug wird gefunden", g.b.toGTP(I.ladderAttack(g.b, P(g, "C2"), L[0], L[1], 0)));
    g = G(9, [".........", ".........", ".........", ".........", "......O..", ".........", "..X......", ".XOO.....", "..XX....."], BLACK);
    g.b.getLibs(g.b.cid[P(g, "C2")], L, 3);
    ok(I.ladderAttack(g.b, P(g, "C2"), L[0], L[1], 0) === 0, "Leiterbrecher: Leiter funktioniert nicht");
  }

  // ================= 2. Zufallspartien gegen Referenz =================
  if (want("random")) {
    section("Zufallspartien mit Referenzvergleich");
    const plan = full ? [[9, 2000], [13, 300], [19, 80], [5, 600], [2, 100], [3, 200]] : [[9, 250], [13, 30], [19, 6], [5, 100], [3, 50]];
    let rsd = 12345; function rr(n) { rsd = (Math.imul(rsd, 1103515245) + 12345) & 0x7fffffff; return rsd % n; }
    for (const pl of plan) {
      const N = pl[0]; let games = 0, moves = 0, checks = 0, err = "", legalChecks = 0, superkoHits = 0;
      for (let gi = 0; gi < pl[1] && !err; gi++) {
        const g = new I.Game(N, 7.5), ref = new Ref(N); let c = BLACK, passes = 0; const cap = Math.min(N * N * 4, 900);
        for (let m = 0; m < cap && passes < 2 && !err; m++) {
          // Legalitaetsvergleich: Stichprobe, in jedem 8. Zug alle Punkte

          const nChk = allPts ? N * N : 6;

      log("  ✓ " + N + "x" + N + ": " + games + " Partien / " + moves + " Zuege / " + checks + " Vollvergleiche / " + legalChecks + " Legalitaetspruefungen / " + superkoHits + " Superko-Faelle");

      for (let i = 0; i < n && !perr; i++) {
        b.clear(); I.seed(1000 + i); I.playout(b, BLACK, false);
        const ref = new Ref(N); for (let k = 0; k < N * N; k++) ref.a[k] = b.color[i2p(b, k)];
        ref.caps = [0, b.cap[1], b.cap[2]];
        perr = compare({ b: b }, ref);
        for (let k = 0; k < N * N && !perr; k++) if (ref.a[k] && ref.group(ref.a, k).libs.size === 0) perr = "Kette ohne Freiheit nach Playout";
      }
    }
    ok(!perr, "Playouts hinterlassen konsistente Bretter (9/13/19)", perr);
  }

  // ================= 3. Selbstspiel =================
  if (want("selfplay")) {
    section("Selbstspiel Engine gegen Engine (ueber die feste Schnittstelle)");
    let E2 = null;
    if (opts.engineSrc) { try { E2 = (new Function(opts.engineSrc + "\nreturn GoEngine;"))(); } catch (e) { log("  (zweite Engine-Instanz nicht erzeugbar: " + e.message + ")"); } }
    const plan = full ? [[9, 12, 60], [9, 4, 250], [13, 4, 80], [19, 2, 100], [9, 3, 15], [19, 1, 30]] : [[9, 3, 40], [13, 1, 50], [19, 1, 50]];
    for (const pl of plan) {
      const N = pl[0], T = pl[2]; let err = "", maxOver = -1e9, totalMoves = 0, gamesDone = 0, resigns = 0, results = [], maxMs = 0, sumPo = 0, nGen = 0;
      for (let gi = 0; gi < pl[1] && !err; gi++) {
        const ref = new Ref(N), tb = new I.Board(N);

            passes = 0; const p = tb.fromGTP(mv);

            if (!ref.play(p2i(tb, p), c)) { err = "Illegaler Zug " + mv + " (Zug " + m + ", Partie " + gi + ")"; break; }
          }
          if (two) { const other = c === BLACK ? engW : engB; if (!other.play(cs, mv)) { err = "play() lehnt legalen Zug " + mv + " ab"; break; } if (gi % 4 === 1 && !eng.play(cs, mv)) { err = "Bestaetigung des eigenen Zugs abgelehnt"; break; } }
          if (passes >= 2) { end = "pass"; break; }
          c = 3 - c;
        }
        if (!err && !end) err = "Partie endet nicht innerhalb von " + cap + " Zuegen";
        if (!err) {
          const gg = engB.game(); let same = true;
          for (let k = 0; k < N * N; k++) if (gg.b.color[i2p(gg.b, k)] !== ref.a[k]) same = false;
          if (!same) err = "Engine-Brett weicht am Ende von der Referenz ab";
          if (two) { const g2 = engW.game(); for (let k = 0; k < N * N; k++) if (g2.b.color[i2p(g2.b, k)] !== ref.a[k]) err = "Brett der zweiten Engine weicht ab"; }
          results.push(end === "resign" ? (c === BLACK ? "W+R" : "B+R") : ((ref.score() - 7.5 > 0 ? "B+" : "W+") + Math.abs(ref.score() - 7.5)));
        }

      }
      ok(!err, N + "x" + N + " @" + T + "ms: " + gamesDone + " Partien ohne Fehler", err);
      log("  ✓ " + N + "x" + N + " @" + T + " ms/Zug: " + gamesDone + " Partien, " + totalMoves + " Zuege, laengster Zug " + maxMs.toFixed(1) + " ms (Limit " + T + "), ⌀ " + Math.round(sumPo / Math.max(1, nGen)) + " Playouts/Zug, Ergebnisse: " + results.join(" "));
    }
    // Zeitgrenzen-Stresstest mit kleinen und krummen Limits
    let terr = "", worst = 0;
    for (const T of [5, 12, 33, 77, 150]) {
      E.newGame(19, 7.5); let c = BLACK;
      for (let m = 0; m < 14 && !terr; m++) { const t0 = I.now(); E.genmove(c === BLACK ? "B" : "W", T); const dt = I.now() - t0; if (dt / T > worst) worst = dt / T; if (dt > T) terr = dt.toFixed(1) + " ms bei Limit " + T + " ms"; c = 3 - c; }
    }
    ok(!terr, "Zeitgrenze wird auch bei sehr kurzen Limits eingehalten (19x19, 5–150 ms)", terr);
    log("  ✓ kurze Zeitlimits: schlechtestes Verhaeltnis Zeit/Limit = " + worst.toFixed(2));
    // Schnittstellen-Robustheit
    E.newGame(9, 7.5);
    ok(E.play("B", "E5") === true && E.play("W", "E5") === false && E.play("b", "c3") === true && E.play("W", "pass") === true, "play(): akzeptiert legale Zuege, lehnt besetzten Punkt ab, Gross-/Kleinschreibung egal");
    const mv = E.genmove("W", 30); ok(typeof mv === "string" && /^([A-HJ-T]\d+|pass|resign)$/.test(mv), "genmove(): liefert Koordinate, pass oder resign", String(mv));
    ok(E.play("W", mv) === true, "play() direkt nach genmove() mit demselben Zug wird als Bestaetigung akzeptiert");
    // Seki: Engine passt statt Selbstmord
    E.setGame(I.setupGame(5, 7.5, [".X.O.", "XXXOO", "XXXOO", "XXXOO", "XXXOO"], BLACK));
    ok(E.genmove("B", 80) === "pass", "Engine passt im Seki (Schwarz)");
    E.setGame(I.setupGame(5, 7.5, [".X.O.", "XXXOO", "XXXOO", "XXXOO", "XXXOO"], WHITE));
    ok(E.genmove("W", 80) === "pass", "Engine passt im Seki (Weiss)");
    // Aufgeben
    E.setGame(I.setupGame(9, 7.5, ["XXXXXXXX.", "XXXXXXXXX", "XX.XXXXXX", "XXXXXXXXX", "XXXXXXXXX", "XXXXXX.XX", "XXXXXXXXX", "XXXXXXXXX", ".XXXXXX.O"], WHITE));
    E.game().b.moves = 60; const rm = E.genmove("W", 300);
    ok(rm === "resign" || rm === "pass", "Engine gibt in hoffnungsloser Stellung auf", rm);
    // einfache Taktik
    E.setGame(I.setupGame(5, 7.5, ["OOOX.", "XXOX.", ".XO..", "XXOX.", "OOOX."], BLACK));
    ok(E.genmove("B", 150) === "D3", "Engine schlaegt die Kette im Atari (entscheidet den Wettlauf)");
    E.setGame(I.setupGame(9, 7.5, [".........", ".........", "..O...O..", "....O....", "...OXO...", ".........", "..X...X..", ".........", "........."], BLACK));
    ok(E.genmove("B", 200) === "E4", "Engine rettet eigenen Stein im Atari");
  }

  if (want("trainer") && typeof Trainer !== "undefined") Trainer.selfTest({ ok: ok, log: log, section: section, full: full, engine: E });
  if (want("tutorial") && typeof Tutorial !== "undefined") Tutorial.selfTest({ ok: ok, log: log, section: section, full: full, engine: E });

  log("");
  log("ERGEBNIS: " + passed + " bestanden, " + failed + " fehlgeschlagen (" + ((Date.now() - t00) / 1000).toFixed(1) + " s)");
  return { passed: passed, failed: failed, failures: failures };
}
return { run: run };

<script type="text/plain" id="worker-src">
// ===== Worker-Befehle (laufen im Web Worker; Fallback: synchron im Hauptthread) =====
var W_cur = null;
var W_LEVELS = [
  { sims: 10, T: 1.3, local: 2.2, gut: 0.35 },  // Absoluter Anfaenger: oft lokaler Bauchzug, sieht Ataris oft nicht
  { sims: 50, T: 0.8, local: 1.5, gut: 0.15 },  // Anfaenger
  { sims: 300, T: 0.45, local: 1.15 }, // Gelegenheitsspieler
  { sims: 1200, T: 0.25, local: 1.0 }, // Fortgeschritten
  { full: true, cap: 1500 },           // Stark
  { full: true }                       // Maximale Staerke
];
function W_sync(size, komi, moves) {
  var E = GoEngine, ok = W_cur && W_cur.size === size && W_cur.komi === komi && W_cur.moves.length <= moves.length, i;
  if (ok) for (i = 0; i < W_cur.moves.length; i++) if (W_cur.moves[i] !== moves[i]) { ok = false; break; }
  if (!ok) { E.newGame(size, komi); W_cur = { size: size, komi: komi, moves: [] }; }
  for (i = W_cur.moves.length; i < moves.length; i++) {
    var cm = moves[i].split(":");
    if (!E.play(cm[0], cm[1])) { W_cur = null; throw new Error("Zug " + cm[1] + " wurde von der Engine abgelehnt"); }
    W_cur.moves.push(moves[i]);
  }
}
// menschlich wirkende Auswahl: nach Besuchen gewichtet, lokale Antworten bevorzugt, Randzuege in der Eroeffnung selten
function W_human(L, c) {
  var E = GoEngine, I = E.internals, g = E.game(), b = g.b, st = I.rootStats(), W = b.W, lm = b.last, w = [], sum = 0, i;
  var early = b.moves < g.N * g.N / 3;
  for (i = 0; i < st.length; i++) {
    var s = st[i]; if (s.p === 0) { w.push(0); continue; }
    var x = Math.pow(s.visits + s.prior * 3, 1 / L.T);
    if (lm > 0) { var d = Math.abs((s.p % W) - (lm % W)) + Math.abs(((s.p / W) | 0) - ((lm / W) | 0)); if (d <= 2) x *= L.local; }
    if (early && b.height[s.p] === 0 && i > 0) x *= 0.1;
    if (i === 0) x *= 1.2;
    w.push(x); sum += x;
  }
  if (!(sum > 0)) return st.length ? st[0].p : 0;
  var r = I.rnd01() * sum;
  for (i = 0; i < st.length; i++) { r -= w[i]; if (r <= 0) return st[i].p; }
  return st[0].p;

  let reduce = false; try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { /* egal */ }
  if (reduce) return;
  if (!fx.cv) { fx.cv = document.createElement("canvas"); fx.cv.className = "fx"; document.body.appendChild(fx.cv); }
  const cv = fx.cv, W = cv.width = innerWidth, H = cv.height = innerHeight, n = o.big ? 70 : 34;
  for (let k = 0; k < n; k++) fx.parts.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.42, vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 9, r: 5 + Math.random() * 7, c: Math.random() < 0.5 ? 1 : 2, life: 1 });

      const g = x.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.35, 1, p.x, p.y, p.r);
      if (p.c === 1) { g.addColorStop(0, "#777"); g.addColorStop(1, "#0d0d0d"); } else { g.addColorStop(0, "#fff"); g.addColorStop(1, "#c8c6bc"); }

}

  let pr = null, g = null, moves = [], hintLvl = 0, solving = false, queue = null, used = false, done = false;
  function home() {
    const s = solvedMap(), ri = rankInfo(), rep = PROBLEMS.filter((p) => s[p.id] && !s[p.id].ok);
    panel.innerHTML = `<div class="card"><p class="eyebrow">Trainingslager</p><div class="row between wrap"><h2>${ri.n} von ${PROBLEMS.length} gelöst</h2><span class="rank">${ri.rank}</span></div>
      <div class="bar"><span style="width:${(ri.n / PROBLEMS.length * 100).toFixed(1)}%"></span></div>
      <p class="small">${userName() ? "Hallo " + esc(userName()) + "! " : ""}Tagesziel: <b>${Math.min(DAILY_GOAL, Store.get("lastDay", "") === today() ? Store.get("dayCount", 0) : 0)} von ${DAILY_GOAL}</b> Erfolgen heute.</p><p class="muted small">${ri.next ? "Nächster Rang " + ri.next[1] + " bei " + ri.next[0] + " gelösten Aufgaben." : "Alle Ränge erreicht."}</p>
      ${rep.length ? `<button class="btn primary wide" id="trep">${rep.length} ${rep.length === 1 ? "Aufgabe" : "Aufgaben"} wiederholen</button>` : ""}
      <div class="cats">${Trainer.CATS.map((c) => { const ps = PROBLEMS.filter((p) => p.cat === c.id), n = ps.filter((p) => s[p.id] && s[p.id].ok).length; return `<button class="cat" data-c="${c.id}"><span class="cicon">${c.icon}</span><span class="cname">${esc(c.name)}</span><span class="cdesc">${esc(c.desc)}</span><span class="cnum">${n}/${ps.length}</span></button>`; }).join("")}</div>
      <h3>Deine Marken <span class="muted small">圍棋 · Wéiqí</span></h3>${(() => { const L = lvlOf(Store.get("xp", 0)); return `<p class="small">${L.next ? "Noch <b>" + L.toNext + " XP</b> bis zur Marke <b>" + esc(L.next.name) + " " + L.next.han + "</b>." : "Du hast alle Marken gesammelt!"}</p><div class="seals">${XPL.map((m, k) => `<div class="sealitem ${k <= L.i ? "got" : ""}" title="${esc(m.txt)}">${seal(m, 54, k > L.i)}<span class="sname">${esc(m.name)}</span><span class="ssub">${k <= L.i ? m.pin : m.xp + " XP"}</span></div>`).join("")}</div>`; })()}
      <h3>Abzeichen</h3><div class="badges">${badges().map((b) => `<div class="badge ${b.got ? "got" : ""}"><span class="bicon">${b.icon}</span><span class="bname">${esc(b.name)}</span><span class="bsub">${esc(b.sub)}</span></div>`).join("")}</div></div>`;
    panel.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => cat(b.dataset.c)));
    if (rep.length) $("#trep").onclick = () => { queue = rep.map((p) => p.id); openP(queue.shift(), true); };
    view.set({ N: 9, stones: new Uint8Array(81), marks: {}, last: -1, interactive: false });
    if (ri.n === 0 && !Store.get("tutorial", {}).brett) toast("Tipp: Neu bei Go? Das Lernen-Tutorial erklärt alle Regeln.");
  }
  function cat(cid) {
    const s = solvedMap(), c = Trainer.CATS.find((x) => x.id === cid), ps = PROBLEMS.filter((p) => p.cat === cid).sort((a, b) => a.lvl - b.lvl);
    panel.innerHTML = `<div class="card"><div class="row between"><p class="eyebrow">Trainingslager</p><button class="link" id="tback">Übersicht</button></div><h2>${esc(c.name)}</h2><p class="muted">${esc(c.desc)}</p>
      <div class="plist">${ps.map((p) => { const st = s[p.id]; return `<button class="pitem ${st ? (st.ok ? "ok" : "fail") : ""}" data-p="${p.id}"><span class="lvl" title="Schwierigkeit">${"●".repeat(p.lvl)}${"○".repeat(3 - p.lvl)}</span><span>${esc(p.title)}</span><span class="pst">${st ? (st.ok ? "★".repeat(st.stars || 1) : "↻") : ""}</span></button>`; }).join("")}</div></div>`;
    $("#tback").onclick = home;
    panel.querySelectorAll("[data-p]").forEach((b) => b.addEventListener("click", () => { queue = ps.map((p) => p.id); queue = queue.slice(queue.indexOf(b.dataset.p) + 1); openP(b.dataset.p, false); }));
  }
  function display() {
    const N = g.N, marks = {}; const P = Trainer.parse(pr);
    for (const t of P.targets) if (g.b.color[t]) marks[iOf(g.b, t)] = "target";
    if (pr.kind === "choice") for (const k in P.options) if (!g.b.color[P.options[k]]) marks[iOf(g.b, P.options[k])] = k;
    if (hintLvl >= 2 && !done) { const sol = iGtp(N, hintMove); if (sol >= 0) { const x0 = sol % N, y0 = (sol / N) | 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const x = x0 + dx, y = y0 + dy; if (x >= 0 && y >= 0 && x < N && y < N && !marks[y * N + x]) marks[y * N + x] = "area"; } if (hintLvl >= 3) marks[sol] = "hint"; } }
    view.set({ N: N, stones: arr(g.b), marks: marks, last: g.b.last ? iOf(g.b, g.b.last) : -1 });
  }
  let hintMove = null, isRepeat = false;
  function openP(id, rep) {
    pr = PROBLEMS.find((p) => p.id === id); isRepeat = rep || (solvedMap()[id] && !solvedMap()[id].ok);
    g = Trainer.displayGame(pr); moves = []; hintLvl = 0; solving = false; used = false; done = false; hintMove = pr.kind === "choice" ? null : pr.sol.split(" ")[0];
    if (pr.kind === "choice") { const P = Trainer.parse(pr); hintMove = g.b.toGTP(P.options[pr.correct[0]]); }
    const c = Trainer.CATS.find((x) => x.id === pr.cat);
    panel.innerHTML = `<div class="card"><div class="row between"><p class="eyebrow">${esc(c.name)} · ${"●".repeat(pr.lvl)}${"○".repeat(3 - pr.lvl)}</p><button class="link" id="tback">${esc(c.name)}</button></div>
      <h2>${esc(pr.title)}</h2><p class="goal"><span>Aufgabe</span>${esc(Trainer.GOAL_TEXT[pr.kind])}</p>
      <div id="tfb" class="feedback" hidden></div><div id="thint" class="hintbox" hidden></div>
      <div class="row gap wrap"><button class="btn" id="th">Hinweis</button><button class="btn" id="tr">Neu beginnen</button><button class="btn" id="ts">Lösung zeigen</button><button class="btn primary" id="tn" hidden>Nächste Aufgabe</button></div>
      <p class="muted small">Die Engine antwortet mit dem stärksten Gegenzug. Alle richtigen Lösungswege werden anerkannt.</p></div>`;
    $("#tback").onclick = () => cat(pr.cat); $("#tr").onclick = () => openP(pr.id, isRepeat); $("#th").onclick = hint; $("#ts").onclick = showSol; $("#tn").onclick = nextP;
    display(); view.interactive = true; view.toPlay = 1; view.onClick = click; view.draw();
  }
  function fb(cls, html) { const f = $("#tfb"); f.hidden = false; f.className = "feedback " + cls; f.innerHTML = html; }
  function hint() {
    hintLvl = Math.min(3, hintLvl + 1); used = true;
    const h = $("#thint"); h.hidden = false;
    h.innerHTML = `<b>Hinweis ${hintLvl}/3:</b> ` + (hintLvl === 1 ? esc(pr.hint) : hintLvl === 2 ? "Der Schlüsselzug liegt im markierten Bereich." : "Dieser Punkt ist der Schlüssel: " + esc(hintMove) + ".");
    if (hintLvl >= 3) $("#th").disabled = true; display();
  }
  let streak = 0;
  function record(ok) {
    const s = solvedMap(), prev = s[pr.id];
    if (ok) {
      const firstSolve = !prev || !prev.ok, fails = prev ? (prev.fails || 0) : 0;
      const stars = used ? (fails ? 1 : 2) : (fails ? 2 : 3), oldStars = (prev && prev.stars) || 0;
      if (prev && !prev.ok) Store.set("repeats", Store.get("repeats", 0) + 1);
      s[pr.id] = { ok: true, clean: !used || !!(prev && prev.clean), stars: Math.max(stars, oldStars), fails: fails, t: Date.now() };
      Store.set("solved", s); streak++;
      const bonus = streak >= 3 ? 5 * Math.min(streak, 6) : 0;
      if (firstSolve || stars > oldStars) { countDaily(); addXP(pr.lvl * 10 + stars * 5 + bonus, praise(), { stars: stars, sub: (streak >= 3 ? streak + " Aufgaben in Folge! " : "") + (stars === 3 ? "Auf Anhieb und ohne Hilfe." : stars === 2 ? "Fast perfekt." : "Geschafft, dranbleiben lohnt sich."), big: streak === 5 || streak === 10 }); }
      else celebrate({ title: praise(), stars: stars, sub: "Wiederholt gelöst" });
      return stars;
    }
    streak = 0;
    if (!prev || !prev.ok) s[pr.id] = { ok: false, fails: (prev ? prev.fails || 0 : 0) + 1, t: Date.now() };
    Store.set("solved", s); return 0;
  }
  async function click(i) {
    if (solving || done) return;
    const N = g.N, m = gtpI(N, i), p = g.b.fromGTP(m);
    const why = g.why(p, 1); if (why) { view.flashAt(i); fb("no", esc(whyText(why))); return; }
    if (pr.kind === "choice") {
      const P = Trainer.parse(pr); let letter = ""; for (const k in P.options) if (P.options[k] === p) letter = k;
      if (!letter) { fb("info", "Wähle einen der markierten Punkte (Buchstaben)."); return; }
      g.play(p, 1); display(); done = true;
      const ok = pr.correct.indexOf(letter) >= 0; record(ok); view.interactive = false;
      fb(ok ? "ok" : "no", `<b>${ok ? praise() : "Nicht der beste Punkt."}</b> ${esc(pr.fb[letter])}` + (ok ? `<p class="explain">${esc(pr.explain)}</p>` : `<p class="explain">Probier es noch einmal mit „Neu beginnen“.</p>`));
      $("#tn").hidden = !ok; if (!ok) $("#tn").hidden = false;
      return;
    }
    solving = true; g.play(p, 1); moves.push(m); display();
    try {
      const r = await call("judge", { pid: pr.id, moves: moves });
      if (r.status === "solved") {
        done = true; record(true); view.interactive = false;
        const alt = moves.length && pr.sol.split(" ").indexOf(moves[0]) < 0 ? "" : (pr.sol.split(" ")[0] !== moves[0] ? ` Auch der Hauptweg ${esc(pr.sol.split(" ")[0])} wäre möglich gewesen.` : "");
        fb("ok", `<b>${praise()}</b> Gelöst.${alt}<p class="explain">${esc(pr.explain)}</p>`); $("#tn").hidden = false;
      } else if (r.status === "failed") {
        if (r.reply && r.reply !== "pass") { await sleep(300); g.play(g.b.fromGTP(r.reply), 2); moves.push(r.reply); display(); }
        record(false); done = true; view.interactive = false;
        const reason = r.outside ? "Dieser Zug liegt außerhalb des umkämpften Bereichs und ändert nichts Entscheidendes." :
          pr.kind === "score" ? (r.loss ? "Damit verlierst du " + r.loss + (r.loss === 1 ? " Punkt" : " Punkte") + " gegenüber dem besten Endspiel." : "Das ist nicht das beste Endspiel.") :
          ({ capture: "Weiß entkommt", save: "Deine Steine gehen verloren", kill: "Weiß bekommt zwei Augen bzw. lebt", live: "Deine Gruppe stirbt", connect: "Weiß trennt deine Steine", cut: "Weiß verbindet seine Steine" })[pr.kind] + (r.reply && r.reply !== "pass" ? " – die stärkste Antwort war " + r.reply + "." : ".");
        fb("no", `<b>Diesmal nicht.</b> ${esc(reason)} <p class="explain">${userName() ? esc(userName()) + ", schau" : "Schau"} dir die Stellung an und versuche es mit „Neu beginnen“ erneut. Auch beim zweiten Versuch gibt es noch Sterne.</p>`);
      } else {
        await sleep(300); g.play(g.b.fromGTP(r.reply), 2); moves.push(r.reply); display();
        fb("info", r.reply === "pass" ? "Weiß passt. Du bist wieder am Zug." : "Weiß antwortet mit " + esc(r.reply) + ". Du bist wieder am Zug.");
        solving = false;
      }
    } catch (e) { fb("no", "Fehler: " + esc(e.message)); solving = false; }
  }
  async function showSol() {
    used = true; if (done && pr.kind !== "choice") return;
    if (pr.kind === "choice") { g = Trainer.displayGame(pr); const P = Trainer.parse(pr); hintLvl = 0; display(); const mk = Object.assign({}, view.marks); mk[iOf(g.b, P.options[pr.correct[0]])] = "hint"; view.set({ marks: mk }); fb("info", `<b>Lösung:</b> ${esc(pr.fb[pr.correct[0]])}<p class="explain">${esc(pr.explain)}</p>`); done = true; view.interactive = false; $("#tn").hidden = false; return; }
    g = Trainer.displayGame(pr); moves = []; display(); view.interactive = false; solving = true; done = true;
    try {
      for (let k = 0; k < 30; k++) {
        const mv = (await call("hint", { pid: pr.id, moves: moves })).move; if (!mv) break;
        if (mv !== "pass") g.play(g.b.fromGTP(mv), 1); else g.play(0, 1); moves.push(mv); display(); await sleep(550);
        const r = await call("judge", { pid: pr.id, moves: moves });
        if (r.status !== "continue") break;
        if (r.reply !== "pass") g.play(g.b.fromGTP(r.reply), 2); else g.play(0, 2); moves.push(r.reply); display(); await sleep(550);
      }
      fb("info", `<b>Lösungsweg:</b> ${esc(moves.join(" – "))}<p class="explain">${esc(pr.explain)}</p>`);
    } catch (e) { fb("no", "Fehler: " + esc(e.message)); }
    $("#tn").hidden = false;
  }
  function nextP() {
    if (queue && queue.length) { openP(queue.shift(), isRepeat); return; }
    const s = solvedMap(), nx = PROBLEMS.find((p) => !s[p.id]); if (nx) { queue = []; openP(nx.id, false); } else home();
  }
  return { home: home };
})();

// ======================= FREIES SPIEL =======================
const Play = (function () {
  let G = null, cfg = null, hist = [], over = null, winHuman = null, tStart = 0, tickT = 0, dead = null, terr = null, mistakes = null, viewIdx = -1;
  function home() {

      </div>
      <label class="check"><input type="checkbox" id="pauto"> Stufe automatisch anpassen (nach zwei Siegen bzw. Niederlagen in Folge)</label>
      <label class="check"><input type="checkbox" id="ptips"> Trainer-Tipps während der Partie</label>
      <p class="muted small">Chinesische Regeln, Gebietszählung, Komi 7,5, Positional Superko.</p>
      <button class="btn primary wide" id="pstart">Neues Spiel</button></div>`;
    $("#psize").value = s.size; $("#pcolor").value = s.color; $("#plevel").value = s.level; $("#ptime").value = s.time; $("#pauto").checked = s.auto; $("#ptips").checked = s.tips;
    $("#pstart").onclick = () => {
      const c = { size: +$("#psize").value, color: $("#pcolor").value, level: +$("#plevel").value, time: +$("#ptime").value, auto: $("#pauto").checked, tips: $("#ptips").checked };
      Store.set("playcfg", c);
      start({ size: c.size, level: c.level, human: c.color === "B" ? 1 : c.color === "W" ? 2 : (Math.random() < 0.5 ? 1 : 2), time: c.time, auto: c.auto, tips: c.tips });
    };
    view.set({ N: s.size, stones: new Uint8Array(s.size * s.size), marks: {}, last: -1, interactive: false });
  }
  function start(o) {
    if (mode !== "play") { mode = "play"; tabs.forEach((t) => t.setAttribute("aria-current", t.dataset.mode === "play" ? "page" : "false")); }
    cfg = Object.assign({ komi: 7.5, tips: true }, o); if (cfg.guided) cfg.komi = 0.5; G = new I.Game(cfg.size, cfg.komi); hist = []; over = null; dead = null; terr = null; mistakes = null; viewIdx = -1; winHuman = 0.5;
    panel.innerHTML = `<div class="card"><div class="row between"><p class="eyebrow">${cfg.guided ? "Erste Partie" : "Freies Spiel"} · ${cfg.size}×${cfg.size}</p><button class="link" id="pback">Einstellungen</button></div>
      <h2 id="pturn"></h2>
      <div class="stats">
        <div><span class="k">Zug</span><span class="v" id="pmove">0</span></div>
        <div><span class="k">Gefangen ●</span><span class="v" id="pcapb">0</span></div>
        <div><span class="k">Gefangen ○</span><span class="v" id="pcapw">0</span></div>
        <div><span class="k">Bedenkzeit</span><span class="v" id="ptime">–</span></div>
      </div>
      <div class="wr"><div class="wrlab"><span>Deine Gewinnchance (Schätzung)</span><b id="pwrv">50 %</b></div><div class="bar"><span id="pwr" style="width:50%"></span></div></div>
      <p class="muted small">Gegner: Stufe ${cfg.level + 1} · ${LEVEL_NAMES[cfg.level]} · ${cfg.time} s Bedenkzeit · Du spielst ${cfg.human === 1 ? "Schwarz" : "Weiß"}</p>
      <div id="pcoach" class="feedback info" hidden></div>
      <div class="row gap wrap" id="pctl"><button class="btn" id="ppass">Passen</button><button class="btn" id="pundo">Zug zurück</button><button class="btn" id="presign">Aufgeben</button><button class="btn" id="pnew">Neues Spiel</button></div>
      <div id="pend"></div></div>`;
    $("#pback").onclick = home; $("#ppass").onclick = () => humanMove(-1); $("#pundo").onclick = undo; $("#presign").onclick = resign; $("#pnew").onclick = () => start(cfg);
    view.set({ N: cfg.size, stones: new Uint8Array(cfg.size * cfg.size), marks: {}, last: -1, terr: null, dead: null, interactive: true, toPlay: cfg.human });
    view.onClick = (i) => humanMove(i);
    if (cfg.guided) coach("Du spielst Schwarz und beginnst. Ein guter erster Zug liegt nahe der Mitte, etwa auf E5 oder auf einem der markierten Sternpunkte.");
    refresh();
    if (cfg.human === 2) engineMove();
  }
  function toPlay() { return hist.length ? 3 - hist[hist.length - 1].c : 1; }
  function movesStr() { return hist.map((h) => (h.c === 1 ? "B" : "W") + ":" + (h.p ? G.b.toGTP(h.p) : "pass")); }
  function refresh() {
    const b = G.b;
    $("#pmove").textContent = hist.length; $("#pcapb").textContent = b.cap[1]; $("#pcapw").textContent = b.cap[2];
    const tp = toPlay();
    $("#pturn").textContent = over ? over.title : busy ? "Die Engine denkt …" : (tp === cfg.human ? "Du bist am Zug" : "Engine am Zug") + " (" + (tp === 1 ? "Schwarz" : "Weiß") + ")";
    const w = Math.round(winHuman * 100); $("#pwr").style.width = w + "%"; $("#pwrv").textContent = w + " %";
    view.set({ stones: arr(b), last: b.last ? iOf(b, b.last) : -1, toPlay: cfg.human, interactive: !over && !busy && tp === cfg.human });
    ["#ppass", "#pundo", "#presign"].forEach((s) => { const e = $(s); if (e) e.disabled = !!over || busy; });
    $("#pundo").disabled = busy || !hist.some((h) => h.c === cfg.human);
  }
  function coach(msg) { const c = $("#pcoach"); if (!c) return; if (!msg) { c.hidden = true; return; } c.hidden = false; c.innerHTML = msg; }
  function tips() {
    if (!(cfg.tips || cfg.guided) || cfg.level > 3 || over) { coach(""); return; }
    const b = G.b, H = cfg.human, own = [], opp = [];
    for (let p = 0; p < b.S; p++) { const c = b.color[p]; if ((c === 1 || c === 2) && b.cid[p] === p && b.atari(p)) { const l = b.libOf(p); if (c === H) own.push([p, l]); else if (G.legal(l, H)) opp.push([p, l, b.csize[p]]); } }
    const msgs = [];
    if (opp.length) { opp.sort((a, b) => b[2] - a[2]); msgs.push(`Gelegenheit: Du kannst ${opp[0][2] > 1 ? opp[0][2] + " Steine" : "einen Stein"} schlagen – auf <b>${b.toGTP(opp[0][1])}</b>.`); }
    if (own.length) msgs.push(`Achtung: Deine Steine bei <b>${b.toGTP(own[0][0])}</b> stehen im Atari. Retten (auf ${b.toGTP(own[0][1])} verlängern) oder bewusst aufgeben?`);
    const fill = 1 - b.ne / (G.N * G.N);
    if (!msgs.length && fill > 0.62) msgs.push("Das Brett füllt sich. Schließe offene Grenzen – und passe, wenn kein Zug mehr Punkte bringt.");
    if (!msgs.length && cfg.guided && hist.length < 8) msgs.push("Tipp: Besetze zuerst große, leere Bereiche und halte deine Steine verbunden.");
    coach(msgs.join("<br>"));
  }
  function humanMove(i) {
    if (over || busy || toPlay() !== cfg.human) return;
    const p = i < 0 ? 0 : pOf(G.b, i);
    const why = G.why(p, cfg.human); if (why) { view.flashAt(i); toast(whyText(why)); return; }
    G.play(p, cfg.human); hist.push({ c: cfg.human, p: p });
    if (G.over()) { finish(); return; }
    refresh(); engineMove();
  }
  async function engineMove() {
    const c = 3 - cfg.human; setBusy(true); refresh(); tStart = performance.now();
    const limit = cfg.time * 1000;
    tickT = setInterval(() => { const e = $("#ptime"); if (e) e.textContent = fmt(((performance.now() - tStart) / 1000).toFixed(1)) + " / " + cfg.time + " s"; }, 100);
    try {
      const r = await call("genmove", { size: cfg.size, komi: cfg.komi, moves: movesStr(), color: c === 1 ? "B" : "W", timeMs: limit, level: cfg.level });
      clearInterval(tickT); setBusy(false);
      const e = $("#ptime"); if (e) e.textContent = fmt((r.ms / 1000).toFixed(2)) + " s";
      if (mode !== "play" || !G) return;
      winHuman = 1 - r.winrate;
      if (r.move === "resign") { over = { title: "Du gewinnst!", text: "Die Engine gibt auf.", winner: cfg.human, resign: true }; endScreen(); return; }
      const p = r.move === "pass" ? 0 : G.b.fromGTP(r.move);
      if (!G.play(p, c)) throw new Error("Engine-Zug " + r.move + " ist illegal");
      hist.push({ c: c, p: p });
      if (r.move === "pass") toast("Die Engine passt." + (hist.length > 1 && hist[hist.length - 2].p === 0 ? "" : " Wenn du auch passt, ist das Spiel aus."));
      if (G.over()) { finish(); return; }
      refresh(); tips();
    } catch (err) { clearInterval(tickT); setBusy(false); toast("Fehler: " + err.message); refresh(); }
  }
  function undo() {
    if (busy || over) return;
    let n = 0; while (hist.length && hist[hist.length - 1].c !== cfg.human) { hist.pop(); n++; } if (hist.length) { hist.pop(); n++; }
    G.undo(n); refresh(); tips();
  }
  function resign() { if (busy || over) return; over = { title: "Aufgegeben", text: "Du hast aufgegeben. Die Engine gewinnt.", winner: 3 - cfg.human, resign: true }; endScreen(); }
  async function finish() {
    setBusy(true); $("#pturn").textContent = "Zählung läuft …"; view.interactive = false;
    try { const r = await call("score", { size: cfg.size, komi: cfg.komi, moves: movesStr() }); dead = new Uint8Array(G.b.S); r.dead.forEach((v, i) => { dead[i] = v; }); }
    catch (e) { dead = new Uint8Array(G.b.S); }
    setBusy(false); score(); endScreen();
  }
  function score() {
    const b = G.b, t = new Uint8Array(b.S), d = I.areaScore(b, dead, t);
    let bs = 0, ws = 0; for (let p = 0; p < b.S; p++) { if (t[p] === 1) bs++; else if (t[p] === 2) ws++; }
    const diff = d - cfg.komi, winner = diff > 0 ? 1 : 2;
    terr = new Uint8Array(cfg.size * cfg.size); const dd = new Uint8Array(cfg.size * cfg.size);
    for (let i = 0; i < cfg.size * cfg.size; i++) { const p = pOf(b, i); terr[i] = t[p]; dd[i] = dead[p]; }
    over = { title: winner === cfg.human ? (userName() ? "Du gewinnst, " + userName() + "!" : "Du gewinnst!") : "Die Engine gewinnt diesmal", text: `Schwarz ${bs} : Weiß ${ws} + ${fmt(cfg.komi)} Komi = ${fmt(ws + cfg.komi)} → <b>${winner === 1 ? "Schwarz" : "Weiß"} gewinnt mit ${fmt(Math.abs(diff))} Punkten</b>.`, winner: winner, counted: true };
    view.set({ terr: terr, dead: dd });
  }
  function endScreen() {
    if (!over.recorded) {
      over.recorded = true; const won = over.winner === cfg.human; if (won) Store.set("wins", Store.get("wins", 0) + 1);
      const capd = G.b.cap[cfg.human];
      if (won) { countDaily(); setTimeout(() => addXP(30 + cfg.level * 15 + (cfg.size > 9 ? 20 : 0), praise("Du hast gewonnen!"), { sub: "Sieg gegen Stufe " + (cfg.level + 1) + " · " + LEVEL_NAMES[cfg.level], big: true }), 300); }
      else {
        setTimeout(() => addXP(5, "Partie beendet", { sub: (capd ? "Du hast " + capd + (capd === 1 ? " Stein" : " Steine") + " gefangen. " : "") + "Jede Partie macht dich stärker." }), 300);
        over.cheer = (userName() ? esc(userName()) + ", nicht" : "Nicht") + " aufgeben! " + (capd ? "Du hast " + capd + (capd === 1 ? " Stein" : " Steine") + " gefangen, das ist schon richtig gut. " : "") + (cfg.level > 0 ? "Probier doch einmal Stufe " + cfg.level + " (" + LEVEL_NAMES[cfg.level - 1] + ")." : "In der Analyse siehst du, welche Züge besser gewesen wären.");
      }
      const h = Store.get("results", []); h.push({ won: won, level: cfg.level, size: cfg.size }); Store.set("results", h.slice(-20));
      if (cfg.auto && !cfg.guided) {
        const last = h.slice(-2); const pc = Store.get("playcfg", {});
        if (last.length === 2 && last.every((x) => x.won && x.level === cfg.level) && cfg.level < 5) { pc.level = cfg.level + 1; Store.set("playcfg", pc); h.push({ marker: 1 }); Store.set("results", h); over.adjust = "Zwei Siege in Folge – die nächste Partie spielt die Engine eine Stufe stärker (" + LEVEL_NAMES[pc.level] + ")."; }
        else if (last.length === 2 && last.every((x) => !x.won && x.level === cfg.level) && cfg.level > 0) { pc.level = cfg.level - 1; Store.set("playcfg", pc); h.push({ marker: 1 }); Store.set("results", h); over.adjust = "Zwei Niederlagen in Folge – die nächste Partie spielt die Engine eine Stufe leichter (" + LEVEL_NAMES[pc.level] + ")."; }
      }
    }
    refresh(); coach("");
    const humanMoves = hist.filter((x) => x.c === cfg.human && x.p).length;
    $("#pend").innerHTML = `<div class="result ${over.winner === cfg.human ? "win" : "loss"}"><h3>${esc(over.title)}</h3><p>${over.text}</p>
      ${over.counted ? `<p class="muted small">Kleine Quadrate zeigen das Gebiet, durchgestrichene Steine gelten als tot. Stimmt etwas nicht? Klicke einen Stein an, um ihn als tot bzw. lebend zu markieren.</p>` : ""}
      ${over.adjust ? `<p class="small"><b>${esc(over.adjust)}</b></p>` : ""}${over.cheer ? `<p class="small">${over.cheer}</p>` : ""}
      ${humanMoves >= 4 ? `<button class="btn primary" id="pana">Partie analysieren</button>` : ""}<div id="pana-out"></div></div>`;
    if ($("#pana")) $("#pana").onclick = analyze;
    if (over.counted) { view.interactive = true; view.marksBlockHover = true; view.onClick = toggleDead; }
    if (cfg.guided && over.counted) $("#pend").insertAdjacentHTML("beforeend", `<p class="small">Glückwunsch zur ersten Partie! Als Nächstes: das <a href="#train" data-go="train">Trainingslager</a> für Taktik oder eine neue Partie.</p>`);
    $("#pend").querySelectorAll("[data-go]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); go(a.dataset.go); }));
  }
  function toggleDead(i) {
    if (!over || !over.counted || viewIdx >= 0) return; const b = G.b, p = pOf(b, i); if (!b.color[p]) return;
    const v = dead[p] ? 0 : 1, h = b.cid[p]; let s = h; do { dead[s] = v; s = b.next[s]; } while (s !== h);
    over.recorded = true; score(); endScreen(); view.marksBlockHover = true;
  }
  async function analyze() {
    const btn = $("#pana"); btn.disabled = true; const out = $("#pana-out");
    out.innerHTML = `<p class="muted small">Analyse läuft … <span id="pprog">0 %</span></p>`; setBusy(true);
    try {
      const r = await call("analyze", { size: cfg.size, komi: cfg.komi, moves: movesStr(), human: cfg.human === 1 ? "B" : "W", sims: cfg.size <= 9 ? 2500 : cfg.size <= 13 ? 1500 : 900 }, (p) => { const e = $("#pprog"); if (e && p.progress != null) e.textContent = Math.round(p.progress * 100) + " %"; });
      mistakes = r.mistakes;
      out.innerHTML = mistakes.length ? `<h4>Deine größten Fehler</h4><ol class="mist">${mistakes.map((m, k) => `<li><button class="mistake" data-k="${k}"><b>Zug ${m.i + 1}:</b> ${esc(m.move)} kostete etwa ${Math.round(m.loss * 100)} % Gewinnchance. Besser: <b>${esc(m.better)}</b></button></li>`).join("")}</ol><p class="muted small">Klicke einen Fehler an, um die Stellung zu sehen (rot: dein Zug, grün: besser).</p><button class="btn" id="pfinal">Endstellung zeigen</button>`
        : `<p>Keine groben Fehler gefunden – stark gespielt!</p>`;
      out.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => showMistake(mistakes[+b.dataset.k])));
      if ($("#pfinal")) $("#pfinal").onclick = () => { viewIdx = -1; view.set({ stones: arr(G.b), terr: terr, dead: over.counted ? view.dead : null, marks: {}, last: G.b.last ? iOf(G.b, G.b.last) : -1 }); };
    } catch (e) { out.innerHTML = `<p class="feedback no">Analyse fehlgeschlagen: ${esc(e.message)}</p>`; }
    setBusy(false); refresh(); if (over.counted) { view.interactive = true; }
  }
  function showMistake(m) {
    const g = new I.Game(cfg.size, cfg.komi); for (let k = 0; k < m.i; k++) g.play(hist[k].p, hist[k].c);
    viewIdx = m.i; const N = cfg.size, mk = {};
    const a = iGtp(N, m.move), b = iGtp(N, m.better); if (a >= 0) mk[a] = "bad"; if (b >= 0) mk[b] = "good";
    const st = arr(g.b); view.set({ stones: st, terr: null, dead: null, marks: mk, last: g.b.last ? iOf(g.b, g.b.last) : -1, ghosts: {} });
    const gh = {}; if (a >= 0) gh[a] = cfg.human; view.ghosts = gh; view.draw(); view.ghosts = {};
  }
  return { home: home, start: start };
})();

// ======================= ENGINE GEGEN ENGINE =======================
let watchRun = false;
const Watch = (function () {
  let G = null, hist = [], size = 9, tm = 1;
  function home() {
    panel.innerHTML = `<div class="card"><p class="eyebrow">Zuschauen</p><h2>Engine gegen Engine</h2>
      <p class="muted">Beide Seiten spielen mit voller Stärke. Gut, um typische Formen und Endspiele zu sehen.</p>
      <div class="form"><label for="wsize">Brettgröße</label><select id="wsize"><option value="9">9 × 9</option><option value="13">13 × 13</option><option value="19">19 × 19</option></select>
      <label for="wtime">Bedenkzeit je Zug</label><select id="wtime"><option value="0.5">0,5 Sekunden</option><option value="1">1 Sekunde</option><option value="2">2 Sekunden</option><option value="5">5 Sekunden</option></select></div>
      <div class="stats"><div><span class="k">Zug</span><span class="v" id="wmove">0</span></div><div><span class="k">Gefangen ●</span><span class="v" id="wcb">0</span></div><div><span class="k">Gefangen ○</span><span class="v" id="wcw">0</span></div><div><span class="k">Letzte Zeit</span><span class="v" id="wt">–</span></div></div>
      <div class="wr"><div class="wrlab"><span>Gewinnchance Schwarz</span><b id="wwrv">50 %</b></div><div class="bar"><span id="wwr" style="width:50%"></span></div></div>
      <div class="row gap wrap"><button class="btn primary" id="wstart">Start</button><button class="btn" id="wstop">Pause</button></div><div id="wend"></div></div>`;
    $("#wsize").value = size; $("#wtime").value = tm;
    $("#wstart").onclick = () => { if (watchRun) return; const ns = +$("#wsize").value; tm = +$("#wtime").value; if (!G || ns !== size || (G.over() || G.ended)) { size = ns; G = new I.Game(size, 7.5); hist = []; $("#wend").innerHTML = ""; } watchRun = true; loop(); };
    $("#wstop").onclick = () => { watchRun = false; };
    if (!G) { G = new I.Game(size, 7.5); hist = []; }
    view.set({ N: size, stones: arr(G.b), marks: {}, last: G.b.last ? iOf(G.b, G.b.last) : -1, interactive: false, terr: null, dead: null });
  }
  async function loop() {
    while (watchRun && mode === "watch" && !G.over() && !G.ended) {
      const c = hist.length ? 3 - hist[hist.length - 1].c : 1; setBusy(true);
      let r; try { r = await call("genmove", { size: size, komi: 7.5, moves: hist.map((h) => (h.c === 1 ? "B" : "W") + ":" + (h.p ? G.b.toGTP(h.p) : "pass")), color: c === 1 ? "B" : "W", timeMs: tm * 1000, level: 5 }); }
      catch (e) { setBusy(false); toast("Fehler: " + e.message); watchRun = false; break; }
      setBusy(false); if (mode !== "watch") return;
      const wb = c === 1 ? r.winrate : 1 - r.winrate; $("#wwr").style.width = Math.round(wb * 100) + "%"; $("#wwrv").textContent = Math.round(wb * 100) + " %"; $("#wt").textContent = fmt((r.ms / 1000).toFixed(2)) + " s";
      if (r.move === "resign") { G.ended = true; $("#wend").innerHTML = `<div class="result"><h3>${c === 1 ? "Schwarz" : "Weiß"} gibt auf</h3></div>`; break; }
      const p = r.move === "pass" ? 0 : G.b.fromGTP(r.move); G.play(p, c); hist.push({ c: c, p: p });
      $("#wmove").textContent = hist.length; $("#wcb").textContent = G.b.cap[1]; $("#wcw").textContent = G.b.cap[2];
      view.set({ stones: arr(G.b), last: p ? iOf(G.b, p) : -1 });
      await sleep(120);
    }
    if (G.over() && mode === "watch") {
      setBusy(true); let dead = new Uint8Array(G.b.S);
      try { const r = await call("score", { size: size, komi: 7.5, moves: hist.map((h) => (h.c === 1 ? "B" : "W") + ":" + (h.p ? G.b.toGTP(h.p) : "pass")) }); r.dead.forEach((v, i) => { dead[i] = v; }); } catch (e) { /* ohne */ }
      setBusy(false);
      const t = new Uint8Array(G.b.S), d = I.areaScore(G.b, dead, t) - 7.5, tt = new Uint8Array(size * size), dd = new Uint8Array(size * size);
      for (let i = 0; i < size * size; i++) { tt[i] = t[pOf(G.b, i)]; dd[i] = dead[pOf(G.b, i)]; }
      view.set({ terr: tt, dead: dd }); $("#wend").innerHTML = `<div class="result"><h3>${d > 0 ? "Schwarz" : "Weiß"} gewinnt mit ${fmt(Math.abs(d))} Punkten</h3></div>`;
      G.ended = true;
    }
    watchRun = false;
  }
  return { home: home };
})();

// ======================= VERSTECKTER TESTMODUS =======================
const TestUI = (function () {
  function home() {
    panel.innerHTML = `<div class="card"><p class="eyebrow">Testmodus</p><h2>Eingebaute Testsuite</h2>
      <p class="muted small">Regeltests, Zufallspartien gegen eine unabhängige Referenz, Selbstspiel mit Zeitkontrolle, Prüfung aller Trainingsaufgaben und Tutorial-Schritte. Läuft im Web Worker.</p>
      <div class="row gap wrap"><button class="btn primary" id="tq">Schnelltest</button><button class="btn" id="tf">Volltest (dauert mehrere Minuten)</button></div>
      <pre id="tlog" class="log" tabindex="0"></pre></div>`;
    $("#tq").onclick = () => run("quick"); $("#tf").onclick = () => run("full");
    view.set({ N: 9, stones: new Uint8Array(81), marks: {}, last: -1, interactive: false });
  }
  async function run(level) {
    const log = $("#tlog"); log.textContent = ""; setBusy(true);
    const add = (s) => { log.textContent += s + "\n"; log.scrollTop = log.scrollHeight; };
    add("Engine: " + C.GoEngine.name + " · Worker: " + (worker ? "ja" : "nein (Hauptthread)"));
    try { const r = await call("tests", { level: level, engineSrc: ENGINE_SRC }, (p) => { if (p.log !== undefined) add(p.log); }); add(r.failed ? "\n✗ " + r.failed + " Fehler" : "\n✓ Alle Tests bestanden."); }
    catch (e) { add("Abbruch: " + e.message); }
    setBusy(false);
  }
  return { home: home };
})();

dayStreak(); hud();

if (!Store.get("askedName", false)) askName(true);
go(["learn", "train", "play", "watch", "test"].indexOf(start) >= 0 ? start : (firstTime ? "learn" : "train"));
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (h !== mode && ["learn", "train", "play", "watch", "test"].indexOf(h) >= 0) go(h); });
})();
